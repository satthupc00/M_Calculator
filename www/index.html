<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1F2126">
<title>M Calc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Lịch sử: màn ngoài = bảng trượt lên; màn trong = cột trái luôn hiện -->
  <aside class="hist" id="hist" aria-label="Lịch sử">
    <div class="hist-head">
      <h2>Lịch sử</h2>
      <span class="hist-count" id="histCount"></span>
    </div>
    <div class="hlist" id="hlist"></div>
    <button class="hclear" id="hclear" type="button">Xoá lịch sử</button>
  </aside>

  <main class="calc">
    <div class="topbar">
      <button class="ibtn" id="btnSettings" type="button" title="Cài đặt" aria-label="Cài đặt">
        <svg viewBox="0 0 24 24"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <span class="latest" id="latest" hidden>latest</span>
      <button class="ibtn upd" id="btnUpdate" type="button" title="Kiểm tra cập nhật" aria-label="Kiểm tra cập nhật">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>
      </button>
    </div>

    <div class="display" id="display">
      <div class="expr" id="expr" aria-live="polite"></div>
      <div class="result" id="result"></div>
    </div>

    <div class="tools">
      <button class="ibtn" id="btnHist" type="button" title="Lịch sử" aria-label="Lịch sử">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="ibtn" id="btnCopy" type="button" title="Sao chép kết quả" aria-label="Sao chép kết quả">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
      </button>
      <span class="sp"></span>
      <button class="ibtn" id="btnBack" type="button" title="Xoá 1 ký tự (giữ để xoá hết)" aria-label="Xoá 1 ký tự">
        <svg viewBox="0 0 24 24"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m17 9-6 6M11 9l6 6"/></svg>
      </button>
    </div>

    <div class="pad" id="pad"></div>
  </main>

  <div class="credit">Created by Mondiro</div>
</div>

<!-- Cài đặt -->
<div class="modal" id="mSettings" hidden>
  <div class="sheet-card">
    <div class="card-head"><h3>Cài đặt</h3><button class="ibtn x" data-close type="button" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="group-title">Phiên bản</div>
    <div class="row"><span>M Calc</span><b id="verText">v1.0.0</b></div>
    <div class="row-btns">
      <button class="btn" id="btnCheck2" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>
        Kiểm tra cập nhật</button>
      <button class="btn" id="btnWhatsNew" type="button">
        <svg viewBox="0 0 24 24"><path d="M9.9 15.5A2 2 0 0 0 8.5 14l-6.1-1.6a.5.5 0 0 1 0-1L8.5 9.9A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5A2 2 0 0 0 15.5 9.9l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/><path d="M20 3v4M22 5h-4"/></svg>
        What's new</button>
    </div>
    <div class="upd-status" id="updStatus"></div>
    <div class="group-title">Tuỳ chọn</div>
    <label class="row toggle"><span>Rung nhẹ khi bấm phím</span><input type="checkbox" id="optVibrate"></label>
    <div class="foot-credit">Created by Mondiro</div>
  </div>
</div>

<!-- What's new -->
<div class="modal" id="mWhatsNew" hidden>
  <div class="sheet-card">
    <div class="card-head"><h3>What's new</h3><button class="ibtn x" data-close type="button" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="wnBody"></div>
  </div>
</div>

<!-- Có bản mới -->
<div class="modal" id="mUpdate" hidden>
  <div class="sheet-card">
    <div class="card-head"><h3 id="updTitle">Có bản mới</h3><button class="ibtn x" data-close type="button" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="upd-notes" id="updNotes"></div>
    <div class="progress" id="updProgress" hidden><i></i></div>
    <button class="btn primary wide" id="btnInstall" type="button">Cập nhật ngay</button>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastAction" hidden></button></div>

<script src="capacitor.js"></script>
<script src="version.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
